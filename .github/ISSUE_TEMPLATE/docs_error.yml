name: Error in the documentation
description: Something in the manuals, the schematics or the README is wrong, unclear or missing
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the correction. Errors found against a real instrument or the original HP, Agilent or Keysight documents are the most valuable reports this project gets.
  - type: dropdown
    id: document
    attributes:
      label: Which document?
      options:
        - "34420A User's Manual"
        - "34420A Technical Service Manual"
        - "34420A Schematics"
        - "README"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page, section, figure or sheet
      placeholder: "Technical Service Manual, Table 1-2, page 1-2"
    validations:
      required: true
  - type: textarea
    id: says
    attributes:
      label: What it says now
      description: Copy the line, or describe the table, figure or part of the sheet.
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What it should say
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How do you know?
      description: For the User's Manual, say whether the original edition says the same thing - the manual follows the originals, so an error carried over from them is still worth noting. For the Technical Service Manual, say which firmware revision your instrument reports and what it did. For the schematics, give the sheet and the reference designator.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Photos, captures or anything else that helps.
    validations:
      required: false
