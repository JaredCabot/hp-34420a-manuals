name: Problem with a firmware image
description: A ROM image is corrupt, does not match, or does not run in an instrument
title: "[Firmware]: "
labels: ["firmware"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Table 1-2 of the Technical Service Manual lists the size and MD5 of each image, so please check the file against it first.

        For a mistake in a manual, use **Error in the documentation** instead.
  - type: dropdown
    id: image
    attributes:
      label: Which image?
      options:
        - "HP_34420a_88851_REV5.0_Fw.bin (revision 5.0)"
        - "Agilent_34420-88871_REV9.0_Fw_AM27C020.bin (revision 9.0)"
        - "KS_34420-88872_REV10.0_fw_AT27C020.bin (revision 10.0)"
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What is wrong?
      options:
        - "Size or MD5 differs from Table 1-2"
        - "The instrument does not start after programming"
        - "The instrument starts but reports an error or fails self-test"
        - "The wrong revision is reported"
        - "Something else"
    validations:
      required: true
  - type: input
    id: idn
    attributes:
      label: Instrument response to *IDN?
      description: Or the front-panel REVISION item, if the instrument starts. Leave blank if it does not.
      placeholder: "HEWLETT-PACKARD,34420A,0,10.0-5.0-2.0"
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: EPROM and programmer
      description: The device you programmed and the programmer and software you used.
      placeholder: "AT27C020-70PU, TL866II Plus with Xgpro 12.x"
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include any message the display showed and any error numbers, word for word.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: If you have read a ROM from your own instrument that differs from these images, say where on the board it came from and its part number label. Please do not attach calibration data from your instrument; it is specific to one unit.
    validations:
      required: false
